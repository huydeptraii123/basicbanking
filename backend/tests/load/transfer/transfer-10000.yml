config:
  target: "http://localhost:4000"
  phases:
    - duration: 30
      arrivalRate: 50  # 50 request/giây = 1500 requests trong 30s
      name: "High load: 50 transfers/second"
    - duration: 30
      arrivalRate: 50  # 50 request/giây = 1500 requests trong 30s  
      name: "Sustained: 50 transfers/second"
  processor: "./processor.js"

scenarios:
  - name: "High volume transfers between 2 bank accounts"
    weight: 100
    flow:
      - function: "loadTestData"
      - post:
          url: "/api/auth/signin"
          json:
            email: "{{ email }}"
            password: "{{ password }}"
          capture:
            - json: "$.token"
              as: "authToken"
      - think: 1
      - post:
          url: "/api/transactions/create"
          headers:
            Authorization: "Bearer {{ authToken }}"
          json:
            sourceAccountId: "{{ sourceAccountId }}"
            destinationAccountId: "{{ destinationAccountId }}"
            amount: "{{ amount }}"
            name: "Load Test Transfer"
          expect:
            - statusCode: 
                - 200
                - 429
                - 503
